# ==========================================================
#  CustomJoinMessages
#  Placeholders: {player} / {displayname} / {prefix} / {suffix} (LuckPerms) + any PlaceholderAPI placeholder. Colors: &a, &l and &#RRGGBB
#  Each message's permission: customjoin.message.<id>
# ==========================================================

settings:
  # Used when the player has NO message equipped.
  # "" = vanilla message, "none" = hide it, any other text = that text
  # Tip: move your EssentialsX custom-join-message here and set it to "none" in Essentials.
  default-join: ""
  default-leave: ""
  # Fills {prefix} / {suffix} with the player's LuckPerms rank prefix/suffix
  luckperms-prefix: true
  # Optional: what {prefix} shows instead of the LuckPerms prefix (PlaceholderAPI allowed), e.g. '%vault_prefix%'
  prefix-format: ''
  sounds:
    open: "block.chest.open"
    equip: "entity.player.levelup"
    unequip: "ui.button.click"
    clear: "entity.item.break"
    page: "item.book.page_turn"
    redeem: "entity.player.levelup"

discordsrv:
  # Sends the custom join/leave messages to Discord and turns DiscordSRV's own join/leave messages off.
  # Set to false to give them back to DiscordSRV.
  enabled: true
  # DiscordSRV channel name ("join" falls back to your main channel, same as DiscordSRV)
  channel: "join"
  # true = embed with the player's head (like DiscordSRV), false = plain text using the formats below
  embed: true
  join-color: "#45D6C6"
  leave-color: "#F06D76"
  join-format: ":inbox_tray: {message}"
  leave-format: ":outbox_tray: {message}"

vouchers:
  # /jm voucher <id> [player] [amount] - right-click the item to unlock the message
  material: NAME_TAG
  name: '{name} &#91A0B5Voucher'
  lore:
    - ''
    - ' &#91A0B5Unlocks a new join message.'
    - ''
    - ' &#45D6C6▶ Right-click to redeem!'
  glow: true
  # Equip the message right after redeeming it
  auto-equip: true
  # Console commands that give the permission. {player}, {uuid}, {permission}, {id}
  redeem-commands:
    - 'lp user {player} permission set {permission} true'

gui:
  title: ' &#127D5A&l✦ &#127D5A&lJ&#12795D&lO&#127560&lI&#127164&lN &#126D67&lM&#12696A&lE&#12646D&lS&#126070&lS&#125C73&lA&#125877&lG&#12547A&lE&#12507D&lS &#12507D&l✦'
  rows: 6
  equipped-glow: true
  content-slots: ['10-16', '19-25', '28-34', '37-43']
  decoration:
    border:
      material: GRAY_STAINED_GLASS_PANE
      slots: ['1-3', '5-7', '9', '17-18', '26-27', '35-36', '44', '46-48', '50-52']
    corners:
      material: CYAN_STAINED_GLASS_PANE
      slots: ['0', '8', '45', '53']
  item-name: '{name}'
  item-lore:
    - ''
    - ' &#91A0B5{description}'
    - ''
    - ' &#8B6BFF┃ &#E8EDF7On join:'
    - '  {join}'
    - ' &#8B6BFF┃ &#E8EDF7On leave:'
    - '  {leave}'
    - ''
    - '{status}'
    - '{action}'
  status-equipped: ' &#45D6C6✔ Equipped'
  status-not-equipped: ' &#5C6370✦ &#91A0B5Not equipped'
  action-equipped: ' &#F06D76▶ Click to unequip!'
  action-not-equipped: ' &#45D6C6▶ Click to equip!'
  buttons:
    current:
      slot: 4
      material: NAME_TAG
      name: '&#E8EDF7&lJOIN MESSAGES'
      lore:
        - ''
        - ' &#91A0B5Choose how the realm announces you'
        - ' &#91A0B5when you join and leave the server.'
        - ''
        - ' &#8B6BFF┃ &#E8EDF7Equipped: {current}'
        - ' &#8B6BFF┃ &#E8EDF7Unlocked: &#45D6C6{unlocked}&#5C6370/&#45D6C6{total}'
        - ' &#8B6BFF┃ &#E8EDF7Page: &#45D6C6{page}&#5C6370/&#45D6C6{pages}'
        - ''
        - ' &#5C6370Get more from crates.'
    clear:
      slot: 47
      material: BUCKET
      name: '&#E8EDF7&lREMOVE MESSAGE'
      lore:
        - ''
        - ' &#91A0B5Go back to the normal'
        - ' &#91A0B5join and leave message.'
        - ''
        - ' &#F06D76▶ Click to remove!'
    previous:
      slot: 48
      material: ARROW
      name: '&#E8EDF7&lPREVIOUS PAGE'
      lore:
        - ''
        - ' &#45D6C6▶ Click to go back!'
    close:
      slot: 49
      material: BARRIER
      name: '&#E8EDF7&lCLOSE'
      lore:
        - ''
        - ' &#F06D76▶ Click to close!'
    next:
      slot: 50
      material: ARROW
      name: '&#E8EDF7&lNEXT PAGE'
      lore:
        - ''
        - ' &#45D6C6▶ Click to go forward!'
    empty:
      slot: 22
      material: PAPER
      name: '&#E8EDF7&lNO MESSAGES'
      lore:
        - ''
        - ' &#91A0B5You don''t have any join messages yet.'
        - ' &#91A0B5Get them from crates.'

